name: Billing v3 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --ansi
      - run: cp .env.example .env
      - run: php artisan key:generate --ansi
      - run: php artisan test

  worker-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: apps/worker-go/go.sum
      - run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go test ./...

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.dev.yml config

  security-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          matches="$(
            git grep -n -E '(PAYOS_API_KEY=.+|MASTER_KEY_BASE64=.+|PRIVATE KEY)' -- . \
              ':(exclude).env.example' \
              ':(exclude)apps/backend-laravel/.env.example' \
              ':(exclude).github/workflows/ci.yml' || true
          )"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Potential secret found"
            exit 1
          fi
